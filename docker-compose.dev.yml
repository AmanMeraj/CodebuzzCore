# Local development only: MySQL on localhost:3306 (not reachable from other machines).
# Run:  docker compose -f docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: codebuzzcore
      MYSQL_USER: ${DB_USERNAME:-codebuzz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - codebuzzcore-mysql:/var/lib/mysql

volumes:
  codebuzzcore-mysql:
